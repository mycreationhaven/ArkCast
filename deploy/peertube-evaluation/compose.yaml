name: arkcast-peertube-evaluation

services:
  peertube:
    image: ${PEERTUBE_IMAGE:?Set PEERTUBE_IMAGE to the verified v8.2.4 image digest}
    env_file: .env
    ports:
      - "127.0.0.1:${PEERTUBE_HOST_PORT:-9000}:9000"
    volumes:
      - peertube-data:/data
      - peertube-config:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [localhost, evaluation]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/api/v1/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-peertube}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [evaluation]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks: [evaluation]
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  localhost:
  evaluation:
    internal: true

volumes:
  peertube-data:
  peertube-config:
  postgres-data:
  redis-data:
